name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg for video pipeline tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,evaluation]"

      - name: Lint
        run: ruff check src/tracklab evaluation scripts tests

      - name: Check formatting
        run: ruff format --check src/tracklab evaluation scripts tests

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: tracklab:ci

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name tracklab-ci \
            -p 18000:8000 \
            -e TRACKLAB_DATABASE_URL=sqlite:////app/data/tracklab.sqlite3 \
            tracklab:ci
          cleanup() {
            docker logs tracklab-ci || true
            docker rm -f tracklab-ci || true
          }
          trap cleanup EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 3 \
            http://127.0.0.1:18000/health
