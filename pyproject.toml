[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracklab"
version = "0.1.1"
description = "YOLO and ByteTrack-based object tracking and video analytics pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Abdullah Durum" },
]
dependencies = [
    "ultralytics",
    "lap>=0.5.12",
    "pydantic>=2",
    "PyYAML",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
evaluation = ["scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"tracklab.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
